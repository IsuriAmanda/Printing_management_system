<div class="Laminating-page">
  <div class="page-header">
    <div class="title">Lamination Types</div>
    <button class="green-btn" (click)="addNewLaminatingPrice()">
      + Add Lamination Type
    </button>
  </div>

  <div class="filter-bar">
    <input
      type="text"
      class="search-input"
      placeholder="Search name or size..."
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)" />
  </div>

  <div class="table-responsive">
    <table class="table q-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Finish Name</th>
          <th>Size</th>
          <th>Dimensions</th>
          <th>Price per Unit (LKR)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>

        <tr *ngIf="isLoading">
          <td colspan="6" class="text-center text-muted">Loading...</td>
        </tr>

        <tr *ngIf="!isLoading && filtered().length === 0 && editRowId() !== 0">
          <td colspan="6" class="text-center text-muted">
            No lamination types found.
          </td>
        </tr>

        <tr *ngIf="editRowId() === 0">
          <td>New</td>
          <td><select class="form-control form-control-sm" [(ngModel)]="editCache.name">
            <option value="" disabled>Select finish</option>
            <option value="Glossy">Glossy</option><option value="Matte">Matte</option>
            <option value="Soft Touch">Soft Touch</option><option value="Anti-Glare">Anti-Glare</option>
          </select></td>
          <td><select class="form-control form-control-sm" [(ngModel)]="editCache.size_id">
            <option value="" disabled>Select size</option>
            <option *ngFor="let std of standards()" [value]="std.size_id">{{ std.size_name }}</option>
          </select></td>
          <td><ng-container *ngIf="selectedStandard() as std">{{ std.width }}&quot; × {{ std.height }}&quot;</ng-container></td>
          <td><input type="number" min="0.01" step="0.01" class="form-control form-control-sm" [(ngModel)]="editCache.price" placeholder="Price"></td>
          <td><div class="d-flex gap-1">
            <button class="btn btn-sm btn-success" (click)="saveEdit(0)" [disabled]="isSaving() === 0">Save</button>
            <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
          </div></td>
        </tr>

        <tr *ngFor="let s of filtered(); trackBy: trackBySupplyId">

          <!-- ID -->
          <td>{{ s.sid }}</td>

          <!-- FINISH NAME -->
          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editName">
              <strong>{{ s.name }}</strong>
            </ng-container>
            <ng-template #editName>
              <select class="form-control form-control-sm"
                [(ngModel)]="editCache.name">
                <option value="Glossy">Glossy</option>
                <option value="Matte">Matte</option>
                <option value="Soft Touch">Soft Touch</option>
                <option value="Anti-Glare">Anti-Glare</option>
              </select>
            </ng-template>
          </td>

          <!-- SIZE — dropdown linked to standards table -->
          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editSize">
              <span class="size-badge">{{ s.size }}</span>
            </ng-container>
            <ng-template #editSize>
              <select class="form-control form-control-sm"
                [(ngModel)]="editCache.size_id">
                <option
                  *ngFor="let std of standards()"
                  [value]="std.size_id">
                  {{ std.size_name }}
                  ({{ std.width }}" × {{ std.height }}")
                </option>
              </select>
            </ng-template>
          </td>

          <!-- DIMENSIONS — read only, from standards join -->
          <td class="dim-cell">
            <span *ngIf="s.width && s.height">
              {{ s.width }}" × {{ s.height }}"
            </span>
            <span *ngIf="!s.width || !s.height" class="text-muted">—</span>
          </td>

          <!-- PRICE -->
          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editPrice">
              LKR {{ s.price | number:'1.2-2' }}
            </ng-container>
            <ng-template #editPrice>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="editCache.price"
                min="0.01"
                step="0.01">
            </ng-template>
          </td>

          <!-- ACTIONS -->
          <td>
            <div class="d-flex gap-1">
              <ng-container *ngIf="editRowId() !== s.sid">
                <button class="btn btn-sm btn-secondary"
                  (click)="startEdit(s)">Edit</button>
                <button class="btn btn-sm btn-danger"
                  (click)="delete(s.sid)">Delete</button>
              </ng-container>

              <ng-container *ngIf="editRowId() === s.sid">
                <button
                  class="btn btn-sm btn-success"
                  (click)="saveEdit(s.sid)"
                  [disabled]="isSaving() === s.sid">
                  {{ isSaving() === s.sid ? 'Saving...' : 'Save' }}
                </button>
                <button
                  class="btn btn-sm btn-outline-secondary"
                  (click)="cancelEdit()">
                  Cancel
                </button>
              </ng-container>
            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
