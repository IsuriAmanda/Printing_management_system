<div class="login-page">
  <div class="login-shell">
    <div class="brand-strip">
      <div class="brand-name">Harshana Printers</div>
    </div>

    <section class="login-panel">
      <h1>Harshana Printers</h1>
      <p class="subtitle">Please enter your credentials to continue</p>

      <div class="message error-box" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <div class="message success-box" *ngIf="successMessage()">
        {{ successMessage() }}
      </div>

      <form [formGroup]="form" (ngSubmit)="login()">
        <label class="input-row">
          <span class="field-icon">Role</span>
          <select formControlName="role">
            <option value="">Select your user type</option>
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Operator">Operator</option>
          </select>
        </label>

        <label class="input-row">
          <span class="field-icon">@</span>
          <input
            type="email"
            formControlName="email"
            placeholder="Your email address">
        </label>

        <label class="input-row">
          <span class="field-icon">Key</span>
          <input
            type="password"
            formControlName="password"
            placeholder="Enter your password">
        </label>

        <button type="submit" class="login-btn" [disabled]="loading()">
          {{ loading() ? 'Please wait...' : 'Log In' }}
        </button>
      </form>

      <button type="button" class="forgot-link" (click)="forgotPassword()" [disabled]="loading()">
        Forget your password?
      </button>
    </section>
  </div>
</div>
