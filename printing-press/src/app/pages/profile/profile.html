<div class="profile-page">
  <div class="page-header">
    <h2>My Profile</h2>
  </div>

  <div class="form-card" *ngIf="user() as u">
    <div class="profile-summary">
      <div class="avatar">{{ u.full_name.charAt(0) }}</div>
      <div>
        <h3>{{ u.full_name }}</h3>
        <span class="role-badge">{{ u.role }}</span>
      </div>
    </div>

    <p class="success-box" *ngIf="message()">{{ message() }}</p>
    <p class="error-box" *ngIf="error()">{{ error() }}</p>

    <form [formGroup]="form" (ngSubmit)="save()">
      <label>Full Name <input type="text" formControlName="full_name"></label>
      <label>Email <input type="email" formControlName="email"></label>

      <button type="submit" class="primary-btn" [disabled]="saving()">
        {{ saving() ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  </div>
</div>
