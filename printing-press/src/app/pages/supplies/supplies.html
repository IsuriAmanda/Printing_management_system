<div class="supplies-page">

  <!-- HEADER -->

  <div class="page-header">

    <div class="title">
      Material Prices
    </div>
    <button 
      type="button" 
      class="green-btn" 
      (click)="addNewMaterial()"
      [disabled]="false">
      + Add Material
    </button>

  </div>

  <!-- FILTER BAR -->

  <div class="filter-bar">

    <input
      type="text"
      class="search-input"
      placeholder="Search Supply ID/name/customer"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)" />

  </div>

  <!-- TABLE -->
    <div class="table-responsive">
    <table class="table table-striped table-bordered q-table">
      <thead>
        <tr>
          <th>Supply ID</th>
          <th>Supply Name</th>
          <th>Height (in)</th>
          <th>Width (in)</th>
          <th>Cost Per Unit</th>
          <th style="width: 180px;">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="filtered().length === 0 && editRowId() !== 0">
          <td colspan="6" class="text-center text-muted">No materials found.</td>
        </tr>

        <tr *ngIf="editRowId() === 0">
          <td>New</td>
          <td><input class="form-control form-control-sm" [(ngModel)]="editCache.name" placeholder="Material name"></td>
          <td><input type="number" min="0.01" step="0.01" class="form-control form-control-sm"
            [(ngModel)]="editCache.height" placeholder="Height"></td>
          <td><input type="number" min="0.01" step="0.01" class="form-control form-control-sm"
            [(ngModel)]="editCache.width" placeholder="Width"></td>
          <td><input type="number" min="0.01" step="0.01" class="form-control form-control-sm"
            [(ngModel)]="editCache.costPerUnit" placeholder="Cost"></td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-success" (click)="saveEdit(0)" [disabled]="isSaving() === 0">Save</button>
              <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
            </div>
          </td>
        </tr>

        <tr *ngFor="let supply of filtered(); trackBy: trackBySupplyId">
          
          <td>{{ supply.sid }}</td>

          <td>
            <ng-container *ngIf="editRowId() !== supply.sid; else editName">
              {{ supply.name }}
            </ng-container>
            <ng-template #editName>
              <input class="form-control form-control-sm" [(ngModel)]="editCache.name">
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="editRowId() !== supply.sid; else editHeight">
              {{ supply.height }}
            </ng-container>
            <ng-template #editHeight>
              <input type="number" min="0.01" step="0.01"
                class="form-control form-control-sm" [(ngModel)]="editCache.height"
                placeholder="Height">
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="editRowId() !== supply.sid; else editWidth">
              {{ supply.width }}
            </ng-container>
            <ng-template #editWidth>
              <input type="number" min="0.01" step="0.01"
                class="form-control form-control-sm" [(ngModel)]="editCache.width"
                placeholder="Width">
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="editRowId() !== supply.sid; else editCost">
              {{ supply.costPerUnit | currency:'LKR ' }}
            </ng-container>
            <ng-template #editCost>
              <input class="form-control form-control-sm" [(ngModel)]="editCache.costPerUnit">
            </ng-template>
          </td>

          <td>
            <div class="d-flex gap-1">
              <ng-container *ngIf="editRowId() !== supply.sid">
                <button class="btn btn-sm btn-secondary" (click)="startEdit(supply)">
                  Edit
                </button>
                <button class="btn btn-sm btn-danger" (click)="delete(supply.sid)">
                  Delete
                </button>
              </ng-container>

              <ng-container *ngIf="editRowId() === supply.sid">
                <button class="btn btn-sm btn-success" (click)="saveEdit(supply.sid)">
                  Save
                </button>
                <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">
                  Cancel
                </button>
              </ng-container>
            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>
