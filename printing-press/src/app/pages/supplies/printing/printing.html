<div class="Printing-page">
  <div class="page-header">
    <div class="title">Printing Price Slabs</div>
    <button class="green-btn" (click)="addNewPrintingPrice()">
      + Add Printing Slab
    </button>
  </div>

  <div class="filter-bar">
    <input
      type="text"
      class="search-input"
      placeholder="Search..."
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)" />
  </div>

  <div class="table-responsive">
    <table class="table q-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Color Type</th>
          <th>Min Qty</th>
          <th>Max Qty</th>
          <th>Price per Unit (LKR)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="isLoading">
          <td colspan="6" class="text-center text-muted">Loading...</td>
        </tr>
        <tr *ngIf="!isLoading && filtered().length === 0 && editRowId() !== 0">
          <td colspan="6" class="text-center text-muted">No printing slabs found.</td>
        </tr>

        <tr *ngIf="editRowId() === 0">
          <td>New</td>
          <td><select class="form-control form-control-sm" [(ngModel)]="editCache.name">
            <option value="" disabled>Select color</option>
            <option value="4color">4 Color</option>
            <option value="1color">1 Color</option>
          </select></td>
          <td><input type="number" min="1" step="1" class="form-control form-control-sm" [(ngModel)]="editCache.min_qty" placeholder="Min qty"></td>
          <td><input type="number" min="1" step="1" class="form-control form-control-sm" [(ngModel)]="editCache.max_qty" placeholder="Max qty"></td>
          <td><input type="number" min="0.01" step="0.01" class="form-control form-control-sm" [(ngModel)]="editCache.price" placeholder="Price"></td>
          <td><div class="d-flex gap-1">
            <button class="btn btn-sm btn-success" (click)="saveEdit(0)" [disabled]="isSaving() === 0">Save</button>
            <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
          </div></td>
        </tr>

        <tr *ngFor="let s of filtered(); trackBy: trackBySupplyId">
          <td>{{ s.sid }}</td>

          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editName">
              <strong>{{ s.name }}</strong>
            </ng-container>
            <ng-template #editName>
              <select class="form-control form-control-sm" [(ngModel)]="editCache.name">
                <option value="4color">4 Color</option>
                <option value="1color">1 Color</option>
              </select>
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editMin">
              {{ s.min_qty }}
            </ng-container>
            <ng-template #editMin>
              <input type="number" min="1" step="1" class="form-control form-control-sm" [(ngModel)]="editCache.min_qty">
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editMax">
              {{ s.max_qty }}
            </ng-container>
            <ng-template #editMax>
              <input type="number" min="1" step="1" class="form-control form-control-sm" [(ngModel)]="editCache.max_qty">
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="editRowId() !== s.sid; else editPrice">
              {{ s.price | currency:'LKR ' }}
            </ng-container>
            <ng-template #editPrice>
              <input type="number" min="0.01" step="0.01" class="form-control form-control-sm" [(ngModel)]="editCache.price">
            </ng-template>
          </td>

          <td>
            <div class="d-flex gap-1">
              <ng-container *ngIf="editRowId() !== s.sid">
                <button class="btn btn-sm btn-secondary" (click)="startEdit(s)">Edit</button>
                <button class="btn btn-sm btn-danger"    (click)="delete(s.sid)">Delete</button>
              </ng-container>
              <ng-container *ngIf="editRowId() === s.sid">
                <button
                  class="btn btn-sm btn-success"
                  (click)="saveEdit(s.sid)"
                  [disabled]="isSaving() === s.sid">
                  {{ isSaving() === s.sid ? 'Saving...' : 'Save' }}
                </button>
                <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
              </ng-container>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
